worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    client_max_body_size 1m;

    map $http_x_correlation_id $correlation_id {
        ""      $request_id;
        default $http_x_correlation_id;
    }

    log_format smartfila '$remote_addr "$request" $status $body_bytes_sent '
                         '"$http_referer" "$http_user_agent" '
                         'correlation_id=$correlation_id';
    access_log /dev/stdout smartfila;
    error_log /dev/stderr warn;

    upstream frontend_upstream {
        server frontend:8080;
    }

    upstream gateway_upstream {
        server gateway:8085;
    }

    upstream identity_upstream {
        server identity:8080;
    }

    upstream inventory_upstream {
        server inventory:8080;
    }

    upstream queue_upstream {
        server queue:8080;
    }

    upstream sales_upstream {
        server sales:8080;
    }

    server {
        listen 80;
        server_name localhost _;

        add_header X-Correlation-Id $correlation_id always;

        location = /health {
            default_type application/json;
            return 200 '{"status":"UP","proxy":"nginx"}';
        }

        location = /nginx-health {
            access_log off;
            default_type text/plain;
            return 200 "UP\n";
        }

        location /graphql {
            proxy_pass http://gateway_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Correlation-Id $correlation_id;
        }

        location ~ ^/(api/v1/(users|sessions)(/|$)|\.well-known/) {
            proxy_pass http://identity_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Correlation-Id $correlation_id;
        }

        location /api/v1/products {
            proxy_pass http://inventory_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Correlation-Id $correlation_id;
        }

        location /api/v1/turnos {
            proxy_pass http://queue_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Correlation-Id $correlation_id;
        }

        location /api/v1/ventas {
            proxy_pass http://sales_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Correlation-Id $correlation_id;
        }

        location /identity/ {
            proxy_pass http://identity_upstream/;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Correlation-Id $correlation_id;
        }

        location /inventory/ {
            proxy_pass http://inventory_upstream/;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Correlation-Id $correlation_id;
        }

        location /queue/ {
            proxy_pass http://queue_upstream/;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Correlation-Id $correlation_id;
        }

        location /sales/ {
            proxy_pass http://sales_upstream/;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Correlation-Id $correlation_id;
        }

        location / {
            proxy_pass http://frontend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Correlation-Id $correlation_id;
        }
    }

    server {
        listen 443 ssl;
        server_name localhost _;

        ssl_certificate /etc/nginx/certs/smartfila.crt;
        ssl_certificate_key /etc/nginx/certs/smartfila.key;
        ssl_protocols TLSv1.2 TLSv1.3;

        add_header X-Correlation-Id $correlation_id always;

        location = /health {
            default_type application/json;
            return 200 '{"status":"UP","proxy":"nginx","tls":true}';
        }

        location /graphql {
            proxy_pass http://gateway_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Correlation-Id $correlation_id;
        }

        location ~ ^/(api/v1/(users|sessions)(/|$)|\.well-known/) {
            proxy_pass http://identity_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Correlation-Id $correlation_id;
        }

        location /api/v1/products {
            proxy_pass http://inventory_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Correlation-Id $correlation_id;
        }

        location /api/v1/turnos {
            proxy_pass http://queue_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Correlation-Id $correlation_id;
        }

        location /api/v1/ventas {
            proxy_pass http://sales_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Correlation-Id $correlation_id;
        }

        location /identity/ {
            proxy_pass http://identity_upstream/;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Correlation-Id $correlation_id;
        }

        location /inventory/ {
            proxy_pass http://inventory_upstream/;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Correlation-Id $correlation_id;
        }

        location /queue/ {
            proxy_pass http://queue_upstream/;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Correlation-Id $correlation_id;
        }

        location /sales/ {
            proxy_pass http://sales_upstream/;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Correlation-Id $correlation_id;
        }

        location / {
            proxy_pass http://frontend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Correlation-Id $correlation_id;
        }
    }
}
