spring.application.name=ventas-service

spring.datasource.url=jdbc:postgresql://localhost:55432/smartfila_sales
spring.datasource.username=sales
spring.datasource.password=${SALES_DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

spring.data.web.pageable.default-page-size=20
spring.data.web.pageable.max-page-size=100

management.endpoints.web.exposure.include=health,info

smartfila.security.issuer=${SMARTFILA_IDENTITY_ISSUER:smartfila-identidad}
smartfila.security.audience=${SMARTFILA_IDENTITY_AUDIENCE:smartfila}
smartfila.security.jwk-set-uri=${SMARTFILA_IDENTITY_JWKS_URI:http://localhost:8081/.well-known/jwks.json}
smartfila.comprobante.verificador-base-url=${SMARTFILA_PUBLIC_BASE_URL:http://localhost:8084}
