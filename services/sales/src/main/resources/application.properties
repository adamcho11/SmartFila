spring.application.name=ventas-service

spring.datasource.url=jdbc:postgresql://localhost:55432/smartfila_sales
spring.datasource.username=sales
spring.datasource.password=${SALES_DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

spring.data.web.pageable.default-page-size=20
spring.data.web.pageable.max-page-size=100

management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.probes.enabled=true
logging.structured.format.console=${SMARTFILA_LOG_FORMAT:logstash}
management.tracing.sampling.probability=${SMARTFILA_TRACING_SAMPLING:0.1}
management.tracing.export.otlp.enabled=${SMARTFILA_OTEL_ENABLED:false}
management.opentelemetry.tracing.export.otlp.endpoint=${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:http://localhost:4318/v1/traces}
management.otlp.metrics.export.enabled=${SMARTFILA_OTEL_ENABLED:false}
management.otlp.metrics.export.url=${OTEL_EXPORTER_OTLP_METRICS_ENDPOINT:http://localhost:4318/v1/metrics}

smartfila.security.issuer=${SMARTFILA_IDENTITY_ISSUER:smartfila-identidad}
smartfila.security.audience=${SMARTFILA_IDENTITY_AUDIENCE:smartfila}
smartfila.security.jwk-set-uri=${SMARTFILA_IDENTITY_JWKS_URI:http://localhost:8081/.well-known/jwks.json}
smartfila.comprobante.verificador-base-url=${SMARTFILA_PUBLIC_BASE_URL:http://localhost:8084}

smartfila.rabbitmq.enabled=${SMARTFILA_RABBITMQ_ENABLED:false}
smartfila.rabbitmq.host=${RABBITMQ_HOST:rabbitmq}
smartfila.rabbitmq.port=${RABBITMQ_PORT:5672}
smartfila.rabbitmq.username=${RABBITMQ_USER:smartfila}
smartfila.rabbitmq.password=${RABBITMQ_PASSWORD:cambiar-esta-clave}
smartfila.rabbitmq.exchange=${RABBITMQ_EXCHANGE:smartfila.domain}
