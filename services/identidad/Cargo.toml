[package]
name = "identidad"
version = "0.2.0"
edition = "2021"
description = "SmartFila · microservicio de Identidad (cuentas, sesión única, roles, JWT y sanciones)"
default-run = "identidad"

[dependencies]
# Dominio
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
serde = { version = "1", features = ["derive"] }
thiserror = "2"
uuid = { version = "1", features = ["serde", "v4"] }

# API REST + Swagger
axum = { version = "0.8", features = ["macros"] }
serde_json = "1"
utoipa = { version = "5", features = ["axum_extras", "uuid", "chrono", "yaml"] }
utoipa-swagger-ui = { version = "9", features = ["axum", "vendored"] }

# gRPC
prost = "0.14"
prost-types = "0.14"
tonic = "0.14"
tonic-prost = "0.14"
tonic-reflection = "0.14"

# Persistencia
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "postgres", "uuid", "chrono", "migrate", "macros"] }

# Seguridad
argon2 = "0.5"
base64 = "0.22"
jsonwebtoken = "9"
rsa = "0.9"

# Infraestructura
anyhow = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }

[build-dependencies]
protoc-bin-vendored = "3"
tonic-prost-build = "0.14"

[dev-dependencies]
http-body-util = "0.1"
rand = "0.8"
tower = { version = "0.5", features = ["util"] }

# Argon2 y la generación de claves RSA son muy lentas sin optimizar; así las
# pruebas no tardan minutos. El código propio sigue compilando en modo debug.
[profile.dev.package."*"]
opt-level = 2
