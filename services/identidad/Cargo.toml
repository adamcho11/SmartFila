[package]
name = "identidad"
version = "0.1.0"
edition = "2021"
description = "SmartFila · microservicio de Identidad (cuentas, sesión única, roles, JWT y sanciones)"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
serde = { version = "1", features = ["derive"] }
thiserror = "2"
uuid = { version = "1", features = ["serde"] }

[dev-dependencies]
serde_json = "1"
