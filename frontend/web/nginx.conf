# Sirve solo la SPA. Las rutas /api y /graphql las reparte el NGINX de
# infrastructure/nginx, que es la única entrada del sistema.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    # index.html siempre fresco para tomar la última versión desplegada.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Archivos con hash en el nombre: se pueden guardar en caché un año.
    location ~* \.(?:js|css|woff2?|png|svg|ico)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Rutas del router de Angular (/panel, /turno...) caen en index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
