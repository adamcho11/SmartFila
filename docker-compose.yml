# SmartFila · sistema completo con un solo comando:
#
#   cp .env.example .env
#   docker compose up -d --build
#
# Cada servicio agrega aquí su contenedor, base de datos y redes. NGINX será la
# entrada compartida; mientras se integra, los servicios publican puertos solo
# en localhost para pruebas desde el host.

name: smartfila

services:
  sales-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: smartfila_sales
      POSTGRES_USER: sales
      POSTGRES_PASSWORD: ${SALES_DB_PASSWORD:?define SALES_DB_PASSWORD en .env}
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - sales-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sales -d smartfila_sales"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - sales-data

  sales:
    build:
      context: .
      dockerfile: services/sales/Dockerfile
    image: smartfila/sales:dev
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://sales-db:5432/smartfila_sales
      SPRING_DATASOURCE_USERNAME: sales
      SPRING_DATASOURCE_PASSWORD: ${SALES_DB_PASSWORD}
      SPRING_PROFILES_ACTIVE: ${SALES_PROFILE:-demo}
      SMARTFILA_INVENTORY_BASE_URL: http://inventory:8080
      SMARTFILA_IDENTITY_JWKS_URI: http://identity:8080/.well-known/jwks.json
      SMARTFILA_IDENTITY_ISSUER: smartfila-identidad
      SMARTFILA_IDENTITY_AUDIENCE: smartfila
      SMARTFILA_PUBLIC_BASE_URL: ${SMARTFILA_PUBLIC_BASE_URL:-http://localhost:8084}
    depends_on:
      sales-db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8084:8080"
    networks:
      - backend
      - sales-data
    restart: unless-stopped

  # Genera una sola vez el par de claves RS256 del JWT en el volumen jwt-keys.
  # jwt.key solo la lee Identidad (uid 10001); jwt.pub es para todos los servicios.
  keygen:
    image: alpine:3.20
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        if [ ! -f /keys/jwt.key ]; then
          apk add --no-cache openssl > /dev/null
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 -out /keys/jwt.key
          openssl pkey -in /keys/jwt.key -pubout -out /keys/jwt.pub
          echo "claves JWT generadas"
        fi
        chown 10001 /keys/jwt.key
        chmod 600 /keys/jwt.key
        chmod 644 /keys/jwt.pub
    volumes:
      - jwt-keys:/keys
    restart: "no"

  identity-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: smartfila_identity
      POSTGRES_USER: identity
      POSTGRES_PASSWORD: ${IDENTITY_DB_PASSWORD:?define IDENTITY_DB_PASSWORD en .env}
    volumes:
      - identity-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U identity -d smartfila_identity"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - identity-data

  identity:
    build:
      context: .
      dockerfile: services/identity/Dockerfile
    image: smartfila/identity:dev
    environment:
      DATABASE_URL: postgres://identity:${IDENTITY_DB_PASSWORD}@identity-db:5432/smartfila_identity
      JWT_PRIVATE_KEY_PATH: /keys/jwt.key
      JWT_KID: identity-1
      RUST_LOG: info,sqlx=warn
    volumes:
      - jwt-keys:/keys:ro
    depends_on:
      keygen:
        condition: service_completed_successfully
      identity-db:
        condition: service_healthy
    ports:
      # Dentro de la red: identity:8080 (REST) e identity:50051 (gRPC).
      - "127.0.0.1:8081:8080"
      - "127.0.0.1:50052:50051"
    networks:
      - backend
      - identity-data
    restart: unless-stopped

  inventory-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: smartfila_inventory
      POSTGRES_USER: inventory
      POSTGRES_PASSWORD: ${INVENTORY_DB_PASSWORD:?define INVENTORY_DB_PASSWORD en .env}
    volumes:
      - inventory-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inventory -d smartfila_inventory"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - inventory-data

  inventory:
    build:
      context: .
      dockerfile: services/inventory/Dockerfile
    image: smartfila/inventory:dev
    environment:
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__InventoryDatabase: Host=inventory-db;Port=5432;Database=smartfila_inventory;Username=inventory;Password=${INVENTORY_DB_PASSWORD}
    depends_on:
      inventory-db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8082:8080"
    networks:
      - backend
      - inventory-data
    restart: unless-stopped

  queue:
    build:
      context: .
      dockerfile: services/queue/Dockerfile
    image: smartfila/queue:dev
    environment:
      ASPNETCORE_URLS: http://+:8080
    ports:
      - "127.0.0.1:8083:8080"
    networks:
      - backend
    restart: unless-stopped

volumes:
  jwt-keys:
  identity-db-data:
  inventory-db-data:
  sales-db-data:

networks:
  # Red común de los servicios, el gateway y NGINX.
  backend:
  # Solo Identidad llega a su base, y la base no sale a internet.
  identity-data:
    internal: true
  inventory-data:
    internal: true
  sales-data:
