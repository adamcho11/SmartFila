# SmartFila · sistema completo con un solo comando:
#
#   cp .env.example .env
#   docker compose up -d --build
#
# Por ahora solo está Identidad. Cada servicio agrega aquí su contenedor, su base
# y sus redes. NGINX será la única entrada; mientras no exista, Identidad publica
# sus puertos solo en localhost para probarla desde el host.

name: smartfila

services:
  # Genera una sola vez el par de claves RS256 del JWT en el volumen jwt-keys.
  # jwt.key solo la lee Identidad (uid 10001); jwt.pub es para todos los servicios.
  keygen:
    image: alpine:3.20
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        if [ ! -f /keys/jwt.key ]; then
          apk add --no-cache openssl > /dev/null
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 -out /keys/jwt.key
          openssl pkey -in /keys/jwt.key -pubout -out /keys/jwt.pub
          echo "claves JWT generadas"
        fi
        chown 10001 /keys/jwt.key
        chmod 600 /keys/jwt.key
        chmod 644 /keys/jwt.pub
    volumes:
      - jwt-keys:/keys
    restart: "no"

  identidad-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: identidad
      POSTGRES_USER: identidad
      POSTGRES_PASSWORD: ${IDENTIDAD_DB_PASSWORD:?define IDENTIDAD_DB_PASSWORD en .env}
    volumes:
      - identidad-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U identidad -d identidad"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - identidad-datos

  identidad:
    build:
      context: .
      dockerfile: services/identidad/Dockerfile
    image: smartfila/identidad:dev
    environment:
      DATABASE_URL: postgres://identidad:${IDENTIDAD_DB_PASSWORD}@identidad-db:5432/identidad
      JWT_PRIVATE_KEY_PATH: /keys/jwt.key
      JWT_KID: identidad-1
      RUST_LOG: info,sqlx=warn
    volumes:
      - jwt-keys:/keys:ro
    depends_on:
      keygen:
        condition: service_completed_successfully
      identidad-db:
        condition: service_healthy
    ports:
      # Dentro de la red: identidad:8080 (REST) e identidad:50051 (gRPC).
      - "127.0.0.1:8081:8080"
      - "127.0.0.1:50052:50051"
    networks:
      - backend
      - identidad-datos
    restart: unless-stopped

volumes:
  jwt-keys:
  identidad-db-data:

networks:
  # Red común de los servicios, el gateway y NGINX.
  backend:
  # Solo Identidad llega a su base, y la base no sale a internet.
  identidad-datos:
    internal: true
