# SmartFila · sistema completo con un solo comando:
#
#   cp .env.example .env
#   docker compose up -d --build
#
# Cada servicio agrega aquí su contenedor, base de datos y redes. NGINX será la
# entrada compartida; mientras se integra, los servicios publican puertos solo
# en localhost para pruebas desde el host.

name: smartfila

services:
  sales-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: smartfila_sales
      POSTGRES_USER: sales
      POSTGRES_PASSWORD: ${SALES_DB_PASSWORD:?define SALES_DB_PASSWORD en .env}
    volumes:
      - sales-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sales -d smartfila_sales"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - sales-data

  sales:
    build:
      context: .
      dockerfile: services/sales/Dockerfile
    image: smartfila/sales:dev
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://sales-db:5432/smartfila_sales
      SPRING_DATASOURCE_USERNAME: sales
      SPRING_DATASOURCE_PASSWORD: ${SALES_DB_PASSWORD}
      SPRING_PROFILES_ACTIVE: ${SALES_PROFILE:-demo}
      SMARTFILA_INVENTORY_BASE_URL: http://inventory:8080
      SMARTFILA_IDENTITY_JWKS_URI: http://identity:8080/.well-known/jwks.json
      SMARTFILA_IDENTITY_ISSUER: smartfila-identidad
      SMARTFILA_IDENTITY_AUDIENCE: smartfila
      SMARTFILA_PUBLIC_BASE_URL: ${SMARTFILA_PUBLIC_BASE_URL:-http://localhost:8084}
      SMARTFILA_OTEL_ENABLED: ${SMARTFILA_OTEL_ENABLED:-false}
      SMARTFILA_TRACING_SAMPLING: ${SMARTFILA_TRACING_SAMPLING:-0.1}
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:-http://host.docker.internal:4318/v1/traces}
      OTEL_EXPORTER_OTLP_METRICS_ENDPOINT: ${OTEL_EXPORTER_OTLP_METRICS_ENDPOINT:-http://host.docker.internal:4318/v1/metrics}
    depends_on:
      sales-db:
        condition: service_healthy
    networks:
      - backend
      - sales-data
    restart: unless-stopped

  # Genera una sola vez el par de claves RS256 del JWT en el volumen jwt-keys.
  # jwt.key solo la lee Identidad (uid 10001); jwt.pub es para todos los servicios.
  keygen:
    image: alpine:3.20
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        if [ ! -f /keys/jwt.key ]; then
          apk add --no-cache openssl > /dev/null
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 -out /keys/jwt.key
          openssl pkey -in /keys/jwt.key -pubout -out /keys/jwt.pub
          echo "claves JWT generadas"
        fi
        chown 10001 /keys/jwt.key
        chmod 600 /keys/jwt.key
        chmod 644 /keys/jwt.pub
    volumes:
      - jwt-keys:/keys
    restart: "no"

  identity-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: smartfila_identity
      POSTGRES_USER: identity
      POSTGRES_PASSWORD: ${IDENTITY_DB_PASSWORD:?define IDENTITY_DB_PASSWORD en .env}
    volumes:
      - identity-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U identity -d smartfila_identity"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - identity-data

  identity:
    build:
      context: .
      dockerfile: services/identity/Dockerfile
    image: smartfila/identity:dev
    environment:
      DATABASE_URL: postgres://identity:${IDENTITY_DB_PASSWORD}@identity-db:5432/smartfila_identity
      JWT_PRIVATE_KEY_PATH: /keys/jwt.key
      JWT_KID: identity-1
      RUST_LOG: info,sqlx=warn
    volumes:
      - jwt-keys:/keys:ro
    depends_on:
      keygen:
        condition: service_completed_successfully
      identity-db:
        condition: service_healthy
    networks:
      - backend
      - identity-data
    restart: unless-stopped

  inventory-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: smartfila_inventory
      POSTGRES_USER: inventory
      POSTGRES_PASSWORD: ${INVENTORY_DB_PASSWORD:?define INVENTORY_DB_PASSWORD en .env}
    volumes:
      - inventory-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inventory -d smartfila_inventory"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - inventory-data

  inventory:
    build:
      context: .
      dockerfile: services/inventory/Dockerfile
    image: smartfila/inventory:dev
    environment:
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__InventoryDatabase: Host=inventory-db;Port=5432;Database=smartfila_inventory;Username=inventory;Password=${INVENTORY_DB_PASSWORD}
    depends_on:
      inventory-db:
        condition: service_healthy
    networks:
      - backend
      - inventory-data
    restart: unless-stopped

  queue:
    build:
      context: .
      dockerfile: services/queue/Dockerfile
    image: smartfila/queue:dev
    environment:
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__QueueDatabase: Host=queue-db;Port=5432;Database=smartfila_queue;Username=queue;Password=${QUEUE_DB_PASSWORD}
    depends_on:
      queue-db:
        condition: service_healthy
    networks:
      - backend
      - queue-data
    restart: unless-stopped

  queue-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: smartfila_queue
      POSTGRES_USER: queue
      POSTGRES_PASSWORD: ${QUEUE_DB_PASSWORD:?define QUEUE_DB_PASSWORD en .env}
    volumes:
      - queue-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U queue -d smartfila_queue"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - queue-data

  gateway:
    build:
      context: ./gateway/graphql
      dockerfile: Dockerfile
    image: smartfila/graphql-gateway:dev
    environment:
      PORT: 8085
      IDENTITY_BASE_URL: http://identity:8080
      INVENTORY_BASE_URL: http://inventory:8080
      QUEUE_BASE_URL: http://queue:8080
    depends_on:
      identity:
        condition: service_healthy
      inventory:
        condition: service_started
      queue:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8085/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - backend
    restart: unless-stopped

  # Angular compilado y servido por NGINX sin root. No publica puertos:
  # se entra por el servicio nginx.
  frontend:
    build:
      context: .
      dockerfile: frontend/web/Dockerfile
    image: smartfila/web:dev
    networks:
      - backend
    restart: unless-stopped

  nginx:
    build:
      context: ./infrastructure/nginx
      dockerfile: Dockerfile
    image: smartfila/nginx:dev
    depends_on:
      frontend:
        condition: service_healthy
      gateway:
        condition: service_healthy
      identity:
        condition: service_healthy
      inventory:
        condition: service_started
      queue:
        condition: service_started
      sales:
        condition: service_healthy
    ports:
      - "127.0.0.1:${SMARTFILA_HTTP_PORT:-8080}:80"
      - "127.0.0.1:8443:443"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - backend
    restart: unless-stopped

volumes:
  jwt-keys:
  identity-db-data:
  inventory-db-data:
  sales-db-data:
  queue-db-data:

networks:
  # Red común de los servicios, el gateway y NGINX.
  backend:
  # Solo Identidad llega a su base, y la base no sale a internet.
  identity-data:
    internal: true
  inventory-data:
    internal: true
  sales-data:
  queue-data:
